spring:
  application:
    name: plug
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        name: test-mcp
        version: 1.0.0
        type: SYNC
        tool-response-mime-type:
          readJPEGImage: image/jpg
#        protocol: streamable
        request-timeout: 6000s

#        streamable-http:
#          mcp-endpoint: /api/mcp
#          keep-alive-interval: 600s
  datasource:
    # 演示应用默认走 H2 内存库；外部 MySQL 依赖移除，避免 mvn spring-boot:run
    # 因网络不可达启动失败。覆盖方式：本地设环境变量
    # SPRING_DATASOURCE_URL=jdbc:mysql://host:port/db 即可切回 MySQL。
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
plugin:
  mcp:
    enabled: true
    parser:
      param: MCPTOOL, JAVADOC, TOOL,
      des: MCPTOOL, JAVADOC, TOOL, JACKSON, SWAGGER3, SWAGGER2
#      param: JAVADOC
#      des: JAVADOC
    scope: interface
    resource:
      enabled: true
    tool:
      enabled: true
    complete:
      enabled: true
    prompt:
      enabled: true

logging:
  level:
    org.springframework.ai: DEBUG
    io.modelcontextprotocol: DEBUG
    com.ai.plug: DEBUG
server:
  port: 8888


